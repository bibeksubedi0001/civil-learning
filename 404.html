<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Civil Engineer's Guide to AI</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="canonical" href="https://civil-learning.bibeksubedi0001.com.np/404.html">

    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:var(--bg-primary);color:var(--text-primary);
            font-family:'Inter',system-ui,sans-serif;
            min-height:100vh;display:flex;align-items:center;justify-content:center;
            padding:2rem;text-align:center;line-height:1.6;
        }
        .wrap{max-width:560px}
        .code{
            font-size:clamp(5rem,18vw,9rem);font-weight:800;line-height:1;
            background:var(--gradient-main);-webkit-background-clip:text;
            -webkit-text-fill-color:transparent;background-clip:text;
            margin-bottom:1rem;
        }
        h1{font-size:1.6rem;margin-bottom:.75rem;font-weight:600}
        p{color:var(--text-secondary);margin-bottom:2rem;font-size:1rem}
        .links{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
        .links a{
            display:inline-flex;align-items:center;gap:.5rem;
            padding:.75rem 1.5rem;border-radius:10px;
            text-decoration:none;font-weight:600;font-size:.9rem;
            background:var(--bg-card);border:1px solid var(--border-subtle);
            color:var(--text-primary);transition:all .25s;
        }
        .links a:hover{border-color:var(--accent-primary);transform:translateY(-2px)}
        .links a.primary{
            background:var(--accent-primary);color:#0a0a0f;border-color:transparent;
        }
        .hint{
            margin-top:2.5rem;font-size:.82rem;color:var(--text-muted);
            display:flex;align-items:center;justify-content:center;gap:.5rem;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">404</div>
        <h1>This page took an unexpected detour.</h1>
        <p>The URL you requested doesn't exist — perhaps a lesson was moved or the link is mistyped. Head back to the index and keep exploring.</p>
        <div class="links">
            <a href="/" class="primary"><i class="fa-solid fa-house"></i> Back to home</a>
            <a href="/#chapters"><i class="fa-solid fa-list"></i> All chapters</a>
        </div>
        <div class="hint">
            <i class="fa-solid fa-compass"></i>
            <span>Tip: try the search on the homepage to find the lesson you want.</span>
        </div>
    </div>
</body>
</html>
