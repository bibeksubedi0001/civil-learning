<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0a0a0f"/>
            <stop offset="100%" stop-color="#111827"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#00d4aa"/>
            <stop offset="100%" stop-color="#0ea5e9"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.3" cy="0.2" r="0.6">
            <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glow2" cx="0.8" cy="0.85" r="0.5">
            <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.16"/>
            <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#glow)"/>
    <rect width="1200" height="630" fill="url(#glow2)"/>

    <!-- decorative grid -->
    <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
        <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200 M0 400 H1200 M0 480 H1200 M0 560 H1200"/>
        <path d="M80 0 V630 M240 0 V630 M400 0 V630 M560 0 V630 M720 0 V630 M880 0 V630 M1040 0 V630"/>
    </g>

    <!-- decorative neural-network nodes -->
    <g fill="#00d4aa" opacity="0.55">
        <circle cx="980" cy="120" r="6"/>
        <circle cx="1060" cy="200" r="5"/>
        <circle cx="930" cy="270" r="4"/>
        <circle cx="1100" cy="320" r="6"/>
        <circle cx="990" cy="400" r="5"/>
        <circle cx="1080" cy="480" r="4"/>
    </g>
    <g stroke="rgba(0,212,170,0.35)" stroke-width="1.2" fill="none">
        <line x1="980" y1="120" x2="1060" y2="200"/>
        <line x1="980" y1="120" x2="930" y2="270"/>
        <line x1="1060" y1="200" x2="1100" y2="320"/>
        <line x1="930" y1="270" x2="990" y2="400"/>
        <line x1="1100" y1="320" x2="990" y2="400"/>
        <line x1="1100" y1="320" x2="1080" y2="480"/>
        <line x1="990" y1="400" x2="1080" y2="480"/>
    </g>

    <!-- badge -->
    <g transform="translate(80, 110)">
        <rect width="280" height="38" rx="19" fill="rgba(0,212,170,0.1)" stroke="rgba(0,212,170,0.35)"/>
        <text x="140" y="25" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700"
              fill="#00d4aa" text-anchor="middle" letter-spacing="2">INTERACTIVE MASTERCLASS</text>
    </g>

    <!-- title -->
    <text x="80" y="245" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800"
          fill="#ffffff">The Civil Engineer's</text>
    <text x="80" y="335" font-family="Inter, system-ui, sans-serif" font-size="92" font-weight="800"
          fill="url(#accent)">Guide to AI</text>

    <!-- subtitle -->
    <text x="80" y="400" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400"
          fill="rgba(255,255,255,0.7)">From topographic contours to neural networks —</text>
    <text x="80" y="432" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400"
          fill="rgba(255,255,255,0.7)">AI &amp; ML for the engineers who build the future.</text>

    <!-- stats -->
    <g transform="translate(80, 500)" font-family="Inter, system-ui, sans-serif">
        <g>
            <text font-size="42" font-weight="800" fill="#00d4aa">6</text>
            <text y="32" font-size="13" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1">CHAPTERS</text>
        </g>
        <g transform="translate(160, 0)">
            <text font-size="42" font-weight="800" fill="#00d4aa">62</text>
            <text y="32" font-size="13" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1">LESSONS</text>
        </g>
        <g transform="translate(320, 0)">
            <text font-size="42" font-weight="800" fill="#00d4aa">120+</text>
            <text y="32" font-size="13" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1">DEMOS</text>
        </g>
        <g transform="translate(490, 0)">
            <text font-size="42" font-weight="800" fill="#00d4aa">240+</text>
            <text y="32" font-size="13" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1">QUIZZES</text>
        </g>
    </g>

    <!-- author/url -->
    <text x="80" y="600" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500"
          fill="rgba(255,255,255,0.45)">civil-learning.bibeksubedi0001.com.np · by Bibek Subedi</text>
</svg>
