name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate HTML & links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: HTML validation (html-validate)
        run: |
          npx --yes html-validate \
            --formatter stylish \
            "index.html" "404.html" "chapter*.html" "chapter*/*.html" || true

      - name: Internal link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            --exclude-path "**/*.bak"
            "index.html"
            "chapter*.html"
            "chapter*/**/*.html"
        continue-on-error: true

  lighthouse:
    name: Lighthouse (informational)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Serve and audit
        run: |
          npm install -g http-server lighthouse
          http-server . -p 8080 &
          sleep 3
          lighthouse http://localhost:8080 \
            --chrome-flags="--headless --no-sandbox" \
            --output=json --output-path=./lighthouse.json \
            --quiet || true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse.json
        if: always()
