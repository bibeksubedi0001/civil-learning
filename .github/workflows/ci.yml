name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate HTML & links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: HTML validation (html-validate)
        run: |
          npx --yes html-validate \
            --formatter stylish \
            "index.html" "404.html" "chapter*.html" "chapter*/*.html" || true

      - name: Internal link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            --exclude-path "**/*.bak"
            "index.html"
            "chapter*.html"
            "chapter*/**/*.html"
        continue-on-error: true

  lighthouse:
    name: Lighthouse (informational)
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Start static server
        run: |
          npx --yes http-server . -p 8080 -s &
          npx --yes wait-on http://localhost:8080 --timeout 30000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/
          uploadArtifacts: true
          temporaryPublicStorage: false
